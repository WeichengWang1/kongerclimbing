[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climbanalyze"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-python>=4.8",
    "ultralytics>=8.2",
    "torch>=2.2",
    "numpy>=1.26",
]

[project.scripts]
climbanalyze = "climbanalyze.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
